<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Live sets from the festivals you're going to, and a festival plan built from the sound you love." />
    <meta name="theme-color" content="#0A0918" />
    <meta name="color-scheme" content="dark" />
    <!-- Link previews (Messages, WhatsApp, Instagram, X, Slack…). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Afterglow" />
    <meta property="og:title" content="Afterglow" />
    <meta property="og:description" content="Live sets from the festivals you're going to, and a festival plan built from the sound you love." />
    <meta property="og:url" content="https://afterglowmusic.app/" />
    <meta property="og:image" content="https://afterglowmusic.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Afterglow: live sets from your festivals, and a plan built from your sound." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Afterglow" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* The night sky from the first frame, so the page never flashes white while it loads. */
        background-color: #0a0918;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Text fields show focus with their own rounded border, not the browser's square outline. */
      input:focus,
      textarea:focus {
        outline: none;
      }
    </style>
  </head>

  <body>
    <noscript>Afterglow needs JavaScript switched on.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
