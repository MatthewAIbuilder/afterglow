# The website (afterglowmusic.app): checked and built on every pull request and every push to main.
# Pushes to main go live; pull requests get a preview link posted on the PR.
# Deploying needs the Firebase secrets described in docs/web-deploy.md; until they're added,
# this still type-checks, tests and builds, and skips the deploy.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" on the Actions tab republishes main by hand.
  workflow_dispatch:
    inputs:
      restore_clips_from:
        description: 'Only to get lost Discover clips back: the version id of an earlier release (Firebase console > Hosting > Release history). Leave empty otherwise.'
        required: false
        default: ''
  # Every night: fresh festivals from EDMTrain (docs/events-import.md), published with the site.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  pull-requests: write
  checks: write
  # The festival page watch opens an issue (an email to the owner) when an official page has news.
  issues: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_YOUTUBE: ${{ secrets.YOUTUBE_API_KEY != '' }}
      HAS_EDMTRAIN: ${{ secrets.EDMTRAIN_API_KEY != '' && github.event_name != 'pull_request' }}
      CAN_DEPLOY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --ci

      # public/catalogue.json is what the app reads (CATALOG_URL). With the EDMTrain key it's
      # rebuilt from EDMTrain; if that fails, the live copy is kept so a bad night never empties it.
      - name: Festivals from EDMTrain
        if: env.HAS_EDMTRAIN == 'true'
        env:
          EDMTRAIN_API_KEY: ${{ secrets.EDMTRAIN_API_KEY }}
        run: |
          if ! npx --yes tsx@4 scripts/import-edmtrain.ts; then
            echo "::warning::EDMTrain import failed; keeping the live catalogue."
            curl -fsS https://afterglowmusic.web.app/catalogue.json -o /tmp/live.json && node -e "JSON.parse(require('fs').readFileSync('/tmp/live.json','utf8'))" && cp /tmp/live.json public/catalogue.json || true
          fi

      # Who sounds alike, learned from shared lineups, so likes reach artists without sound tags (docs/events-import.md).
      - name: Sounds alike from lineups
        if: github.event_name != 'pull_request'
        run: npx --yes tsx@4 scripts/lineup-similar.ts || echo "::warning::Sounds alike was skipped tonight."

      # Artist photos from Deezer's public search, reusing the ones already published (docs/events-import.md).
      - name: Artist photos
        if: github.event_name != 'pull_request'
        run: |
          curl -fsS https://afterglowmusic.web.app/catalogue.json -o /tmp/published.json || true
          npx --yes tsx@4 scripts/artist-photos.ts /tmp/published.json || echo "::warning::Artist photos were skipped tonight."

      # Each artist's colour, from their photo (docs/events-import.md).
      - name: Artist colours
        if: github.event_name != 'pull_request'
        run: |
          npm install --no-save jpeg-js@0.4.4
          npx --yes tsx@4 scripts/artist-colors.ts /tmp/published.json || echo "::warning::Artist colours were skipped tonight."

      # The picture each festival's official site shares (often its lineup poster), for festivals with a website (docs/events-import.md).
      - name: Pictures from official sites
        if: github.event_name != 'pull_request'
        run: npx --yes tsx@4 scripts/site-pictures.ts /tmp/published.json || echo "::warning::Site pictures were skipped tonight."

      # Getting lost clips back (docs/events-import.md): the clips of an earlier release, copied to a short-lived
      # preview channel and read from there. Only when asked for on "Run workflow". Never prints the key.
      - name: Clips from an earlier release
        if: env.CAN_DEPLOY == 'true' && github.event_name == 'workflow_dispatch' && inputs.restore_clips_from != ''
        continue-on-error: true
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VERSION: ${{ inputs.restore_clips_from }}
          PROJECT: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || 'afterglowmusic' }}
        run: |
          VERSION=$(printf '%s' "$VERSION" | sed 's#.*/versions/##' | tr -d '[:space:]')
          [[ "$VERSION" =~ ^[A-Za-z0-9]{6,40}$ ]] || { echo "::error::That doesn't look like a release's version id."; exit 1; }
          printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-key.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-key.json"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx --yes firebase-tools@14 hosting:clone "$PROJECT@$VERSION" "$PROJECT:clips-restore" --non-interactive < /dev/null
          npx --yes firebase-tools@14 hosting:channel:list --project "$PROJECT" --json > "$RUNNER_TEMP/channels.json"
          url=$(node -e '
            const list = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).result?.channels ?? [];
            console.log(list.find((c) => c.name.split("/").pop() === "clips-restore")?.url ?? "");' "$RUNNER_TEMP/channels.json")
          [ -n "$url" ] && curl -fsS "$url/catalogue.json" -o /tmp/restore.json || echo "::warning::Couldn't read that release's clips."
          npx --yes firebase-tools@14 hosting:channel:delete clips-restore --project "$PROJECT" --force --non-interactive < /dev/null || true
          [ -f /tmp/restore.json ] && node -e "console.log('Clips in that release:', (JSON.parse(require('fs').readFileSync('/tmp/restore.json','utf8')).clips ?? []).length)"

      # Discover clips: the best live set on YouTube for artists on upcoming festivals, a few a night (docs/events-import.md).
      # Only the nightly run (and "Run workflow") searches, so merges during the day don't use up YouTube's daily quota;
      # every run keeps the clips already found. If the step fails, it runs again with no searches; if that fails too,
      # nothing is deployed, so the site is never published without its clips.
      - name: YouTube clips
        if: github.event_name != 'pull_request' && env.HAS_YOUTUBE == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLIP_SEARCHES: ${{ github.event_name == 'push' && '0' || '' }}
        run: |
          npx --yes tsx@4 scripts/youtube-clips.ts /tmp/published.json /tmp/restore.json \
            || CLIP_SEARCHES=0 npx --yes tsx@4 scripts/youtube-clips.ts /tmp/published.json /tmp/restore.json \
            || { echo "::error::YouTube clips failed twice. Stopping before the deploy, so the live site keeps its Discover clips."; exit 1; }

      - name: Build the website
        run: npm run build:web
        env:
          EXPO_PUBLIC_BUILD_ID: ${{ github.sha }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID || secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}

      # Festival and artist pages get their own link previews (docs/web-deploy.md).
      - name: Link previews
        run: npx --yes tsx@4 scripts/page-previews.ts dist

      # A look at festivals' official pages: new artist names, set times, a new poster.
      # When one has news, a GitHub issue (GitHub emails it to the owner). Nothing is imported (docs/events-import.md).
      - name: Festival page watch
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
        run: |
          rm -f /tmp/page-watch.md
          npx --yes tsx@4 scripts/page-watch.ts dist /tmp/page-watch.md || echo "::warning::Page watch was skipped tonight."

      - name: Check the Firebase key
        if: env.CAN_DEPLOY == 'true'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # Never prints the key: only says whether it looks like the .json file Firebase gives you.
        run: |
          if ! printf '%s' "$KEY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const k=JSON.parse(s);process.exit(k.type==="service_account"&&k.private_key?0:1)}catch{process.exit(1)}})'; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT secret isn't a Firebase service account key. It should be the whole .json file from Firebase console > Project settings > Service accounts > Generate new private key (it starts with {). See docs/web-deploy.md, step 2."
            exit 1
          fi

      # Firebase allows only so many preview channels per site, and each lasts 7 days, so a busy week of
      # pull requests fills them up ("channel quota reached"). Previews of pull requests that are closed
      # are removed first. Never prints the key.
      - name: Make room for the preview
        if: env.CAN_DEPLOY == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || 'afterglowmusic' }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-key.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-key.json"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          open=$(gh pr list --repo "${{ github.repository }}" --state open --limit 200 --json number --jq '.[].number' | tr '\n' ' ')
          npx --yes firebase-tools@14 hosting:channel:list --project "$PROJECT" --json > "$RUNNER_TEMP/channels.json"
          # Channels are named pr<number>-<branch> by the deploy action; keep the open ones and anything else.
          OPEN="$open" node -e '
            const open = new Set(process.env.OPEN.trim().split(/\s+/).filter(Boolean));
            const list = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).result?.channels ?? [];
            for (const c of list) {
              const id = c.name.split("/").pop();
              const m = /^pr(\d+)-/.exec(id);
              if (m && !open.has(m[1])) console.log(id);
            }' "$RUNNER_TEMP/channels.json" > "$RUNNER_TEMP/stale.txt"
          echo "Removing $(wc -l < "$RUNNER_TEMP/stale.txt") previews of closed pull requests"
          while read -r id; do
            npx --yes firebase-tools@14 hosting:channel:delete "$id" --project "$PROJECT" --force --non-interactive < /dev/null || true
          done < "$RUNNER_TEMP/stale.txt"

      - name: Deploy (live from main, a preview for pull requests)
        if: env.CAN_DEPLOY == 'true'
        # A preview that can't be made (quota, a Firebase hiccup) is only a missing link on the PR; going live from main must succeed.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # The Firebase project (also in .firebaserc).
          projectId: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID || 'afterglowmusic' }}
          channelId: ${{ github.event_name != 'pull_request' && 'live' || '' }}

      # The page watch's news, only once tonight's look is live: otherwise tomorrow compares with the
      # old look and opens the same issue (and email) again.
      - name: Festival news heads-up
        if: env.CAN_DEPLOY == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/page-watch.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Festival news: $(date -u +'%b %-d')" --body-file /tmp/page-watch.md || echo "::warning::Couldn't open the heads-up issue."
          fi

      # Database and storage rules (firestore.rules, storage.rules, firestore.indexes.json), so new
      # features' rules go live with the app instead of waiting for a deploy from a PC. The database rules go
      # first and on their own, so a storage problem never holds back messages, profiles and the rest.
      # Never prints the key.
      - name: Database and storage rules
        if: env.CAN_DEPLOY == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || 'afterglowmusic' }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-key.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-key.json"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          failed=0
          if npx --yes firebase-tools@14 deploy --only firestore:rules,firestore:indexes --project "$PROJECT" --non-interactive; then
            echo "Database rules and indexes are live."
          else
            failed=1
            echo "::warning::Couldn't deploy the database rules. Give the key the Firebase Rules Admin, Cloud Datastore Index Admin and Service Usage Consumer roles (docs/web-deploy.md), or deploy them from your PC (docs/firebase-setup.md, step 5)."
          fi
          if npx --yes firebase-tools@14 deploy --only storage --project "$PROJECT" --non-interactive; then
            echo "Storage rules are live."
          else
            failed=1
            echo "::warning::Couldn't deploy the storage rules. Give the key the Cloud Storage for Firebase Admin role too (docs/web-deploy.md), or deploy them from your PC (docs/firebase-setup.md, step 5)."
          fi
          exit $failed
